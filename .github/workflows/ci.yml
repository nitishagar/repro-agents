name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Sets UV_PYTHON so every `uv run` in `make all` uses this interpreter.
          python-version: ${{ matrix.python-version }}
      - name: Sync environment
        run: uv sync --extra dev --extra llm
      - name: Build target (lint + typecheck + unit tests + self-check)
        run: make all

  integration:
    name: integration (docker oracle + network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync environment
        run: uv sync --extra dev --extra llm
      # ubuntu-latest ships a running Docker daemon, so the DockerSandbox oracle
      # tests execute for real here (they skip locally when no daemon is present).
      - name: Integration tests
        run: uv run pytest -m integration -q
