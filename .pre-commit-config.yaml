# Outer-loop backpressure: runs on every commit. `pre-commit install` to enable.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies: [types-requests]

  - repo: local
    hooks:
      - id: anti-theater
        name: anti-theater self-check (Oracle Principle)
        entry: python -m repro_agents._selfcheck
        language: system
        pass_filenames: false
        files: ^src/
